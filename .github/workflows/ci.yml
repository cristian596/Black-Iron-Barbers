name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Front-end (lint, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  backend:
    name: Back-end (tests con Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: black_iron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: ci_test_user
      DB_PASSWORD: ci_test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: black_iron_test
      JWT_SECRET: ci_test_jwt_secret
      ADMIN_USER: admin_ci_test
      ADMIN_PASSWORD: admin_ci_test_12345
      FRONTEND_URL: http://localhost:5173
      PORT: 5055

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Tests
        working-directory: backend
        run: npm test

services:
  # Servicio de la Base de Datos para Black Iron Barbers
  db_black_iron:
    image: postgres:15-alpine
    container_name: black_iron_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_barber_data:/var/lib/postgresql/data

  # Servicio del Backend
  backend_black_iron:
    build: ./backend
    container_name: black_iron_backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db_black_iron
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      PORT: 5000
      TZ: America/Bogota
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      # Fotos de perfil subidas desde el dashboard (backend/uploads): sobreviven a recrear el contenedor.
      - fotos_perfil_data:/app/uploads
    depends_on:
      - db_black_iron

volumes:
  postgres_barber_data:
  fotos_perfil_data:
